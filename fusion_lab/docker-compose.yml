# Step 1, once:  docker compose run --rm prep --accept-nuscenes-license
# Step 2:        docker compose up app     then open http://localhost:7860
services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    image: fusion-lab-app
    ports:
      - "7860:7860"
    volumes:
      - ./cache:/app/cache:ro

  prep:
    build:
      context: .
      dockerfile: docker/prep.Dockerfile
    image: fusion-lab-prep
    profiles: ["prep"]
    volumes:
      - ./cache:/app/cache
