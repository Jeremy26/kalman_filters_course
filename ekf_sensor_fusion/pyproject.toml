[project]
name = "kf-fusion"
version = "0.1.0"
description = "Lidar + radar Extended Kalman Filter — a sensor-fusion reference project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
# Visualization is optional so the core filter installs cleanly in any Colab.
viz = ["foxglove-sdk>=0.11", "matplotlib>=3.6"]
dev = ["pytest>=7.0"]

[project.scripts]
run-ekf = "kf_fusion.run_ekf:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
